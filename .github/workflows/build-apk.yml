name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Restore Keystore
      run: |
        if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    - name: Build Debug APK
      run: gradle :app:assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ROICMS-Railway-Inspection-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
